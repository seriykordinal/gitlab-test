stages:
  - test
  - build
  - docker

variables:
  # Имя образа в Docker Hub. Замените "your-dockerhub-username" на ваш логин.
  DOCKER_IMAGE: "$DOCKER_HUB_USER/gitlab-test:$CI_COMMIT_SHORT_SHA"
  DOCKER_IMAGE_LATEST: "$DOCKER_HUB_USER/gitlab-test:latest"
# --- ТЕСТЫ ---
test:
  stage: test
  image: golang:1.25-alpine
  script:
    - go vet ./...
    - go test ./...

# --- СБОРКА БИНАРНИКА (опционально) ---
build:
  stage: build
  image: golang:1.25-alpine
  script:
    - CGO_ENABLED=0 go build -o app .
  artifacts:
    paths:
      - app
    expire_in: 1 week

# --- СБОРКА DOCKER-ОБРАЗА через Kaniko ---
docker-build:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    # Кодируем учетные данные в base64 и создаем правильный config.json
    - |
      echo "{
        \"auths\": {
          \"https://index.docker.io/v1/\": {
            \"auth\": \"$(echo -n \"$DOCKER_HUB_USER:$DOCKER_HUB_PASS\" | base64 | tr -d '\n')\"
          }
        }
      }" > /kaniko/.docker/config.json
    # Выводим файл для отладки (необязательно, но полезно)
    - cat /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$DOCKER_IMAGE"
      --destination "$DOCKER_IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"